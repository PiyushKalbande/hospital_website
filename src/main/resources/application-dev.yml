# ---------------------------------------------------------------------------
#  DEV profile — H2 in-memory running in MySQL compatibility mode.
#  Boots with zero infrastructure. H2 console: /h2-console
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:chinche;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: chinche-dev-pool
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

chinche:
  seeding:
    enabled: ${SEED_DEMO_DATA:true}

logging:
  level:
    in.chinche.hospital: DEBUG
    org.hibernate.SQL: DEBUG
