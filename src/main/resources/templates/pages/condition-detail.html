<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}" th:lang="${lang}">
<head><title layout:fragment="title" th:text="${pageTitle}">Condition</title></head>
<body>
<main layout:fragment="content">
    <section class="chh-pagehead">
        <div class="chh-container">
            <nav class="chh-breadcrumb mb-3">
                <a th:href="@{/}" th:text="#{nav.home}">Home</a><span>/</span>
                <a th:href="@{/conditions}" th:text="#{section.stories.title}">Conditions</a><span>/</span>
                <span th:text="${condition.name}">Name</span>
            </nav>
            <div class="chh-row" style="align-items:flex-start;gap:20px">
                <span class="chh-icon chh-icon--lg" style="width:70px;height:70px;flex:0 0 70px">
                    <svg style="width:34px;height:34px"><use th:href="@{'/img/icons/sprite.svg#' + ${condition.iconKey}}"></use></svg>
                </span>
                <div>
                    <h1 th:text="${condition.name}">Condition</h1>
                    <p class="chh-lead mt-1 mb-0 chh-mr" th:if="${condition.nameMr != null}" th:text="${condition.nameMr}">मराठी</p>
                </div>
            </div>
        </div>
    </section>
    <section class="chh-section">
        <div class="chh-container">
            <div class="chh-alert chh-alert--warn mb-4">
                <svg><use href="/img/icons/sprite.svg#alert"></use></svg>
                <span>This page is general information, not medical advice. If symptoms are severe or sudden, call
                    <a th:href="'tel:108'"><b>108</b></a> or come to our emergency department.</span>
            </div>
            <div class="chh-section-head">
                <div class="chh-section-head__title">
                    <span class="chh-eyebrow">Our team</span>
                    <h2>Doctors who treat this</h2>
                </div>
            </div>
            <div class="chh-grid-3" th:if="${doctors != null and !doctors.isEmpty()}">
                <th:block th:each="d : ${doctors}">
                    <div th:replace="~{fragments/page-head :: doctorCard(${d})}"></div>
                </th:block>
            </div>
            <div class="mt-4">
                <a class="chh-btn chh-btn--primary" th:href="@{/book}" th:text="#{nav.book}">Book appointment</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
