<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}" th:lang="${lang}">
<head><title layout:fragment="title" th:text="${pageTitle}">Announcement</title></head>
<body>
<main layout:fragment="content">
    <section class="chh-pagehead">
        <div class="chh-container">
            <nav class="chh-breadcrumb mb-3">
                <a th:href="@{/}" th:text="#{nav.home}">Home</a><span>/</span>
                <a th:href="@{/announcements}" th:text="#{nav.news}">Updates</a>
            </nav>
            <span class="chh-chip chh-chip--accent mb-3" th:if="${announcement.badge != null}" th:text="${announcement.badge}">Badge</span>
            <h1 style="max-width:820px" th:text="${isMarathi} and ${announcement.titleMr != null} ? ${announcement.titleMr} : ${announcement.title}">Title</h1>
            <p class="chh-lead mt-2 mb-0" style="max-width:760px" th:text="${announcement.summary}">Summary</p>
            <div class="chh-tiny chh-faint mt-3" th:if="${announcement.publishedAt != null}"
                 th:text="${#temporals.format(announcement.publishedAt,'d MMMM yyyy')}">Date</div>
        </div>
    </section>
    <section class="chh-section">
        <div class="chh-container">
            <div class="chh-article" style="max-width:780px">
                <div th:utext="${announcement.body}">Body</div>
                <div class="mt-4">
                    <a class="chh-btn chh-btn--primary" th:href="@{/book}" th:text="#{nav.book}">Book appointment</a>
                    <a class="chh-btn chh-btn--ghost" th:href="@{/announcements}" th:text="#{common.prev}">Back</a>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
