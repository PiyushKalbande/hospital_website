<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    th:lang="${lang} ?: 'en'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'Doctor portal | Chinche Hospital'">Doctor portal</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body style="background:var(--chh-surface)">
<div class="chh-admin">
    <aside class="chh-admin__side">
        <a class="chh-brand" th:href="@{/doctor/dashboard}">
            <span class="chh-brand__mark"><svg><use href="/img/icons/sprite.svg#heart"></use></svg></span>
            <span class="chh-brand__text"><span class="chh-brand__name">Chinche</span><span class="chh-brand__sub">Doctor portal</span></span>
        </a>
        <ul class="chh-admin__nav">
            <li><a th:href="@{/doctor/dashboard}" th:classappend="${activeView == 'dashboard'} ? 'active'"><svg><use href="/img/icons/sprite.svg#dashboard"></use></svg>Dashboard</a></li>
            <li><a th:href="@{/doctor/appointments}" th:classappend="${activeView == 'appointments'} ? 'active'"><svg><use href="/img/icons/sprite.svg#calendar"></use></svg>My appointments</a></li>
            <li><a th:href="@{/doctor/attendance}" th:classappend="${activeView == 'attendance'} ? 'active'"><svg><use href="/img/icons/sprite.svg#user"></use></svg>My attendance</a></li>
        </ul>
        <ul class="chh-admin__nav" style="margin-top:auto;border-top:1px solid rgba(255,255,255,.09);padding-top:14px">
            <li><a th:href="@{/}"><svg><use href="/img/icons/sprite.svg#globe"></use></svg>View website</a></li>
            <li><form th:action="@{/admin/logout}" method="post" style="margin:0">
                <button type="submit" style="display:flex;align-items:center;gap:11px;padding:11px 20px;width:100%;background:none;border:0;color:#A8C2BB;font-size:.875rem;font-weight:600;font-family:inherit;cursor:pointer;text-align:left">
                    <svg style="width:17px;height:17px"><use href="/img/icons/sprite.svg#logout"></use></svg>Sign out
                </button>
            </form></li>
        </ul>
    </aside>
    <div class="chh-admin__main">
        <div class="chh-alert chh-alert--ok mb-3" th:if="${success}" th:text="${success}">Success</div>
        <div class="chh-alert chh-alert--err mb-3" th:if="${error}" th:text="${error}">Error</div>
        <main layout:fragment="content"></main>
    </div>
</div>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
