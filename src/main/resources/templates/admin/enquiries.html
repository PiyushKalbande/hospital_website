<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head><title layout:fragment="title">Enquiries | Chinche Hospital Admin</title></head>
<body>
<main layout:fragment="content">
    <div class="chh-admin__head">
        <div><h1 class="chh-h2">Enquiries</h1>
            <p class="chh-small chh-muted mb-0"><b th:text="${enquiries.totalElements}">0</b> messages from the website.</p></div>
        <form class="d-flex gap-2" method="get" th:action="@{/admin/enquiries}">
            <select class="chh-select" name="status" style="width:auto" onchange="this.form.submit()">
                <option value="">All</option>
                <option value="NEW" th:selected="${status == 'NEW'}">New</option>
                <option value="IN_PROGRESS" th:selected="${status == 'IN_PROGRESS'}">In progress</option>
                <option value="CLOSED" th:selected="${status == 'CLOSED'}">Closed</option>
            </select>
        </form>
    </div>
    <div class="chh-card">
        <div class="table-responsive"><table class="chh-table">
            <thead><tr><th>Received</th><th>Name</th><th>Contact</th><th>Type</th><th>Message</th><th>Status</th></tr></thead>
            <tbody>
            <tr th:each="e : ${enquiries.content}">
                <td class="chh-tiny chh-faint" th:text="${#temporals.format(e.createdAt,'d MMM, HH:mm')}">Date</td>
                <td class="chh-strong" th:text="${e.name}">Name</td>
                <td class="chh-small"><span th:text="${e.phone}">Phone</span><br>
                    <span class="chh-tiny chh-faint" th:text="${e.email}">Email</span></td>
                <td><span class="chh-chip chh-chip--outline" th:text="${e.enquiryType}">Type</span></td>
                <td class="chh-small" th:text="${#strings.abbreviate(e.message,110)}">Message</td>
                <td><span class="chh-status"
                          th:classappend="${e.status == 'NEW'} ? 'chh-status--pending' : (${e.status == 'CLOSED'} ? 'chh-status--completed' : 'chh-status--confirmed')"
                          th:text="${e.status}">Status</span></td>
            </tr>
            <tr th:if="${enquiries.content.isEmpty()}">
                <td colspan="6" class="chh-muted text-center py-4">No enquiries yet.</td>
            </tr>
            </tbody>
        </table></div>
    </div>
</main>
</body>
</html>
