<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:lang="${lang} ?: 'en'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE" th:text="${pageTitle} ?: 'Admin'">Admin</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body style="background:var(--chh-surface)">

<div class="chh-admin">
    <aside class="chh-admin__side">
        <a class="chh-brand" th:href="@{/admin/dashboard}">
            <span class="chh-brand__mark"><svg><use href="/img/icons/sprite.svg#heart"></use></svg></span>
            <span class="chh-brand__text">
                <span class="chh-brand__name">Chinche</span>
                <span class="chh-brand__sub">Staff console</span>
            </span>
        </a>

        <ul class="chh-admin__nav">
            <li><a th:href="@{/admin/dashboard}" th:classappend="${activeView == 'dashboard'} ? 'active'">
                <svg><use href="/img/icons/sprite.svg#dashboard"></use></svg> Dashboard</a></li>
            <li><a th:href="@{/admin/appointments}" th:classappend="${activeView == 'appointments'} ? 'active'">
                <svg><use href="/img/icons/sprite.svg#calendar"></use></svg> Appointments</a></li>
            <li><a th:href="@{/admin/doctors}" th:classappend="${activeView == 'doctors'} ? 'active'">
                <svg><use href="/img/icons/sprite.svg#user"></use></svg> Doctors</a></li>
            <li><a th:href="@{/admin/catalogue}" th:classappend="${activeView == 'catalogue'} ? 'active'">
                <svg><use href="/img/icons/sprite.svg#clipboard"></use></svg> Catalogue</a></li>
            <li><a th:href="@{/admin/facilities}" th:classappend="${activeView == 'facilities'} ? 'active'">
                <svg><use href="/img/icons/sprite.svg#building"></use></svg> Centres</a></li>
            <li><a th:href="@{/admin/enquiries}" th:classappend="${activeView == 'enquiries'} ? 'active'">
                <svg><use href="/img/icons/sprite.svg#feedback"></use></svg> Enquiries</a></li>
        </ul>

        <ul class="chh-admin__nav" style="margin-top:auto;border-top:1px solid rgba(255,255,255,.09);padding-top:14px">
            <li><a th:href="@{/}">
                <svg><use href="/img/icons/sprite.svg#globe"></use></svg> View website</a></li>
            <li><a th:href="@{/swagger-ui/index.html}" target="_blank" rel="noopener" >
                <svg><use href="/img/icons/sprite.svg#report"></use></svg> API docs</a></li>
            <li>
                <form th:action="@{/admin/logout}" method="post" style="margin:0">
                    <button type="submit" style="display:flex;align-items:center;gap:11px;padding:11px 20px;width:100%;
                            background:none;border:0;color:#A8C2BB;font-size:.875rem;font-weight:600;font-family:inherit;cursor:pointer;text-align:left">
                        <svg style="width:17px;height:17px"><use href="/img/icons/sprite.svg#logout"></use></svg> Sign out
                    </button>
                </form>
            </li>
        </ul>
    </aside>

    <div class="chh-admin__main">
        <div class="chh-alert chh-alert--ok mb-3" th:if="${success}">
            <svg><use href="/img/icons/sprite.svg#check-circle"></use></svg><span th:text="${success}">Success</span>
        </div>
        <div class="chh-alert chh-alert--err mb-3" th:if="${error}">
            <span th:text="${error}">Something went wrong.</span>
        </div>
        <main layout:fragment="content"></main>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
