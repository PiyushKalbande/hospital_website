<!DOCTYPE html>
<!--
  ============================================================================
  चींचे हॉस्पिटल | CHINCHE HOSPITAL — master layout
  Every public page decorates this layout via thymeleaf-layout-dialect.
  Blocks a page may override: title, meta, head-extra, content, scripts
  ============================================================================
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:lang="${lang} ?: 'en'">
<head th:replace="~{fragments/head :: head}"></head>

<body th:classappend="${isMarathi} ? 'chh-mr'">

<a class="sr-only-focusable" href="#chh-main" th:text="#{nav.menu}">Skip to content</a>

<!-- Top strip: emergency, helpline, language switch -->
<div th:replace="~{fragments/header :: topbar}"></div>

<!-- Sticky header + mega nav -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Mobile off-canvas navigation -->
<div th:replace="~{fragments/header :: offcanvas}"></div>

<main id="chh-main" layout:fragment="content">
    <!-- page content -->
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Floating mobile CTA -->
<!-- Hidden on the booking page by js/app.js -->
<a class="chh-fab" id="chhFab" href="/book">
    <svg><use href="/img/icons/sprite.svg#calendar"></use></svg>
    <span th:text="#{nav.book}">Book appointment</span>
</a>

<div th:replace="~{fragments/footer :: sprite}"></div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
