# ---------------------------------------------------------------------------
#  चींचे हॉस्पिटल | Chinche Hospital, Katol (Maharashtra)
#  Platform configuration — profile-agnostic core settings.
#
#  Profiles
#    dev    -> H2 in-memory (MySQL compatibility mode). Zero-install.
#    mysql  -> MySQL 8 (production / staging). Credentials via env vars.
# ---------------------------------------------------------------------------
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: chinche-hospital
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  # ---------- Thymeleaf ----------
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  # ---------- JPA (dialect/datasource come from the active profile) ----------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30
          time_zone: Asia/Kolkata
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  # ---------- HTTP ----------
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 12MB
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 604800
          cache-public: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

  # ---------- Mail (booking confirmations). No-op logger transport by default. ----------
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 2048
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false

# ---------- Caching (lookups are read-heavy, write-light) ----------
chinche:
  cache:
    enabled: true
  seeding:
    # Loads demo catalogue (specialities, doctors, packages, content) on an empty DB
    enabled: ${SEED_DEMO_DATA:false}
  booking:
    slot-minutes: 20
    advance-days: 45
    max-per-slot: 1
    reference-prefix: CHH
  contact:
    address-line-1: "चींचे हॉस्पिटल, बस स्थानक चौक"
    address-line-2: "मुळाई रोड, कटोल, जि. नागपूर"
    pincode: "441302"
    state: "महाराष्ट्र"
    phone: "+91 70836 82563"
    emergency: "108 / +91 70836 82563"
    email: "dadakalbande111@gmail.com"
    map-embed: "https://www.google.com/maps?q=Katol,+Nagpur,+Maharashtra+441302&output=embed"
  mail:
    from: ${MAIL_FROM:dadakalbande111@gmail.com}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
    api-version: ${WHATSAPP_API_VERSION:v22.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:doctor_emergency_reschedule}
    language-code: ${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
  assistant:
    enabled: ${AI_ASSISTANT_ENABLED:true}
    allow-unverified-knowledge: ${AI_ALLOW_UNVERIFIED_KNOWLEDGE:false}
    ollama:
      enabled: ${AI_OLLAMA_ENABLED:false}
      base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${AI_OLLAMA_MODEL:qwen2.5:1.5b}
      timeout-seconds: ${AI_OLLAMA_TIMEOUT_SECONDS:120}
      context-length: ${AI_OLLAMA_CONTEXT_LENGTH:4096}
      max-tokens: ${AI_OLLAMA_MAX_TOKENS:192}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /api-docs
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    in.chinche.hospital: DEBUG
    org.hibernate.SQL: WARN
